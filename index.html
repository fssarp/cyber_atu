<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Terminal | Cyber ATU</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: monospace;
    background: black;
    color: #00ff00;
    overflow-x: hidden;
  }
  
  /* --- MATRIX ARKA PLAN --- */
  canvas#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    opacity: 0.3;
  }

  /* --- SİTE LOGOSU --- */
  .site-logo {
    position: absolute; 
    top: 20px; 
    left: 30px; 
    width: 100px; 
    height: auto;
    z-index: 1000; 
    transition: 0.3s; 
    cursor: pointer;
  }
  .site-logo:hover { 
    filter: drop-shadow(0 0 15px #00ff00); 
    transform: scale(1.05); 
  }

  /* --- AÇILIR MENÜ (BİZİ TANIYIN) --- */
  .header-alani {
    position: absolute; 
    top: 20px;
    right: 30px;
    z-index: 999; 
  }
  .dropdown { position: relative; display: inline-block; }
  .dropbtn {
    background-color: black; color: #00ff00; padding: 10px 20px; font-size: 16px;
    font-family: monospace; border: 1px solid #00ff00; cursor: pointer;
    border-radius: 5px; transition: 0.3s;
  }
  .dropbtn:hover { background-color: #00ff00; color: black; box-shadow: 0 0 10px #00ff00; }
  .dropdown-content {
    display: none; position: absolute; right: 0; background-color: black;
    min-width: 160px; border: 1px solid #00ff00; z-index: 1; border-radius: 5px;
  }
  .dropdown-content a {
    color: #00ff00; padding: 12px 16px; text-decoration: none; display: block;
    font-family: monospace; transition: 0.2s;
  }
  .dropdown-content a:hover { background-color: #00ff00; color: black; }
  .dropdown:hover .dropdown-content { display: block; }

  /* --- ANA TERMİNAL KUTUSU --- */
  .main-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .terminal-box {
    background: rgba(0, 20, 0, 0.85);
    border: 2px solid #00ff00;
    border-radius: 10px;
    padding: 50px;
    text-align: center;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
  }

  .terminal-box h1 {
    font-size: 3rem;
    margin-top: 0;
    text-shadow: 0 0 15px #00ff00;
    border-bottom: 2px dashed #00ff00;
    padding-bottom: 15px;
  }

  .typewriter {
    font-size: 1.2rem;
    color: #fff;
    margin-bottom: 40px;
    text-shadow: 0 0 5px #00ff00;
  }

  /* --- MENÜ BUTONLARI --- */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }

  .cyber-btn {
    background: transparent;
    color: #00ff00;
    border: 1px solid #00ff00;
    padding: 15px 20px;
    font-size: 1.1rem;
    font-family: monospace;
    font-weight: bold;
    text-decoration: none;
    border-radius: 5px;
    transition: 0.3s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .cyber-btn:hover {
    background: #00ff00;
    color: black;
    box-shadow: 0 0 20px #00ff00;
    transform: translateY(-3px);
  }

  /* Butonlardaki küçük uyarı renkleri */
  .btn-warning:hover {
    background: #ffaa00;
    color: black;
    border-color: #ffaa00;
    box-shadow: 0 0 20px #ffaa00;
  }

  .btn-danger:hover {
    background: #ff0000;
    color: white;
    border-color: #ff0000;
    box-shadow: 0 0 20px #ff0000;
  }

</style>
</head>
<body>

<canvas id="matrix"></canvas>

<a href="index.html">
  <img src="cyber_atu_logo.jpg" alt="Cyber ATU Logo" class="site-logo" onerror="this.style.display='none'">
</a>

<div class="header-alani">
  <div class="dropdown">
    <button class="dropbtn">Bizi Tanıyın ▼</button>
    <div class="dropdown-content">
      <a href="biz_kimiz.html">> Biz Kimiz?</a>
      <a href="#">> Vizyonumuz</a>
      <a href="ekibimiz.html">> Ekibimiz</a>
    </div>
  </div>
</div>

<div class="main-container">
  <div class="terminal-box">
    <h1>>_ CYBER ATU</h1>
    <p class="typewriter">[SYS_LOG] Adana Alparslan Türkeş Bilim ve Teknoloji Üniversitesi Siber Güvenlik Topluluğu Merkez Sistemine Bağlanıldı...</p>
    
    <div class="menu-grid">
      <a href="rank.html" class="cyber-btn">> Yarışmalar ve Oyunlar</a>
      <a href="bilinc.html" class="cyber-btn">> Siber Bilinçlendirme</a>
      
      <a href="tuzak.html" class="cyber-btn btn-danger">> [DİKKAT] Sistemi Tara</a>
    </div>
  </div>
</div>

<script>
  // MATRIX EFEKTİ
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const letters = "0101010101CYBERATU";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";
    for(let i=0;i<drops.length;i++){
      const text = letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(text,i*fontSize,drops[i]*fontSize);
      if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw,50);
  window.addEventListener('resize',()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
