<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: monospace;
    background: black;
    color: #00ff00;
    overflow-x: hidden;
  }

  /* DAKTİLO İMLECİ (CURSOR) EFEKTİ */
  .typing-cursor::after {
    content: '█';
    animation: blink 1s step-start infinite;
    color: #00ff00;
    margin-left: 5px;
  }
  @keyframes blink { 
    50% { opacity: 0; } 
  }

  canvas#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }
  section {
    padding: 100px 20px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  footer {
    background-color: rgba(0,0,0,0.8);
    text-align: center;
    padding: 20px;
    z-index: 1;
    position: relative;
    border-top: 1px solid #004400;
  }
  a.instagram-link {
    color: #00ff00 !important;
    text-decoration: none;
  }

  /* BİZİ TANIYIN BUTONU */
  .header-alani {
    position: absolute;
    top: 20px;
    right: 30px;
    z-index: 999;
  }
  .dropdown {
    position: relative;
    display: inline-block;
  }
  .dropbtn {
    background-color: black;
    color: #00ff00;
    padding: 10px 20px;
    font-size: 16px;
    font-family: monospace;
    border: 1px solid #00ff00;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
  }
  .dropbtn:hover {
    background-color: #00ff00;
    color: black;
    box-shadow: 0 0 10px #00ff00;
  }
  .dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: black;
    min-width: 160px;
    border: 1px solid #00ff00;
    box-shadow: 0px 8px 16px 0px rgba(0,255,0,0.2);
    z-index: 1;
    border-radius: 5px;
  }
  .dropdown-content a {
    color: #00ff00;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    transition: 0.2s;
  }
  .dropdown-content a:hover {
    background-color: #00ff00;
    color: black;
  }
  .dropdown:hover .dropdown-content {
    display: block;
  }

  /* TERMİNAL TASARIMI */
  .terminal-box {
    background-color: rgba(0, 0, 0, 0.9);
    border: 2px solid #00ff00;
    border-radius: 10px;
    padding: 25px;
    max-width: 650px;
    margin: 10px auto;
    text-align: left;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
  }
  .terminal-header {
    border-bottom: 1px dashed #004400;
    margin-bottom: 15px;
    padding-bottom: 5px;
    color: #00ff00;
    font-weight: bold;
    font-size: 0.9rem;
  }
  .terminal-input-row {
    display: flex;
    align-items: center;
    margin-top: 25px;
    border-top: 1px solid #002200;
    padding-top: 15px;
  }
  #terminalInput {
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: monospace;
    font-size: 1.2rem;
    outline: none;
    flex-grow: 1;
    text-shadow: 0 0 5px #00ff00;
    caret-color: #00ff00;
    margin-left: 10px;
  }

  /* UYARI MESAJI */
  .system-hint {
    color: #00ff00;
    font-size: 0.9rem;
    margin-bottom: 15px;
    opacity: 0.8;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; text-shadow: 0 0 5px #00ff00; }
    100% { opacity: 0.5; }
  }

  /* YUKARI ÇIK BUTONU */
  #backToTopBtn {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 99;
    font-size: 18px;
    border: 1px solid #00ff00;
    outline: none;
    background-color: black;
    color: #00ff00;
    cursor: pointer;
    padding: 10px 15px;
    border-radius: 5px;
    font-family: monospace;
  }
</style>
</head>
