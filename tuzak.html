<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SİSTEM KRİTİK UYARI | Cyber ATU</title>
<style>
  body {
    margin: 0; padding: 0; font-family: monospace;
    background: black; overflow: hidden;
  }
  
  /* MATRIX ARKA PLAN */
  canvas#matrix { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.3; }
  
  /* ANA KUTU */
  .alert-box {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 0, 0, 0.95); border: 3px solid #ff0000;
    box-shadow: 0 0 50px rgba(255, 0, 0, 0.8); border-radius: 10px;
    padding: 30px; text-align: center; z-index: 10; width: 90%; max-width: 550px;
    animation: popIn 0.3s ease-out forwards;
    backdrop-filter: blur(5px);
  }

  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    80% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  /* KEDİ RESMİ */
  .cat-image {
    width: 100%; max-height: 250px; object-fit: cover;
    border-radius: 5px; border: 2px dashed #ff0000;
    margin-bottom: 15px;
  }

  /* HACKLENDİNİZ BAŞLIĞI */
  .alert-box h1 {
    color: #ff0000; font-size: 2.8rem; margin-top: 0; margin-bottom: 10px;
    text-shadow: 0 0 15px #ff0000; animation: blink 1s infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* GECİKMELİ GELEN UYARILAR */
  .warnings-container {
    opacity: 0; 
    animation: fadeIn 0.5s ease-in forwards;
    animation-delay: 1s; 
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .highlight {
    color: #00ff00; font-size: 1.4rem; font-weight: bold;
    display: block; margin: 15px 0; text-shadow: 0 0 10px #00ff00;
  }

  .timer-text { color: #aaa; font-size: 1rem; margin-top: 15px; }

  /* KAYDIRMALI BUTON (Faresi gizli değil artık) */
  .tuzak-btn {
    background: #ff0000; color: #fff; border: 1px solid #ff0000;
    padding: 12px 25px; font-size: 1.1rem; cursor: pointer; 
    font-family: monospace; font-weight: bold; transition: top 0.1s, left 0.1s; 
    margin-top: 15px; border-radius: 5px; box-shadow: 0 0 10px #ff0000;
  }
</style>
</head>
<body onclick="tamEkranDene()">

<canvas id="matrix"></canvas>

<div class="alert-box" id="alertBox">
  <img src="trol_kedi.jpeg" onerror="this.onerror=null; this.src='trol_kedi.jpg';" alt="Bağıran Kedi" class="cat-image">
  
  <h1>>_ HACKLENDİNİZ!</h1>
  
  <div class="warnings-container" id="warnings">
    <p style="color:#fff; margin-bottom: 5px; font-size: 1.1rem;">Cihazınızdaki güvenlik protokolleri aşıldı...</p>
    <p style="color:#fff; margin-bottom: 5px;">Sisteme yönlendiriliyorsunuz...</p>
    
    <span class="highlight">"Her gördüğünüz QR kodu okutmayınız :)"</span>
    
    <div class="timer-text">Güvenli alana geçişe kalan süre: (<span id="countdown">5.0</span>)</div>
    
    <button class="tuzak-btn" id="kacanBtn" onmouseover="btnKactir()" ontouchstart="btnKactir()">Hemen Geç</button>
  </div>
</div>

<script>
  // MATRIX EFEKTİ
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const letters = "010101010101HACKED";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff0000"; 
    ctx.font = fontSize + "px monospace";
    for(let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 50);

  // --- SİBER SENARYO MOTORU ---
  const timerElement = document.getElementById('countdown');
  const kacanBtn = document.getElementById('kacanBtn');
  
  function yonlendir() {
    window.location.href = 'bilinc.html';
  }

  // 5 SANİYELİK GERİ SAYIM
  let seconds = 5.0;
  const countdownInterval = setInterval(() => {
    seconds -= 0.1; 
    timerElement.innerText = Math.max(0, seconds).toFixed(1); 
    
    if (seconds <= 0) {
      clearInterval(countdownInterval);
      yonlendir();
    }
  }, 100); 

  // --- KAÇAN BUTON MOTORU ---
  function btnKactir() {
    kacanBtn.style.position = 'fixed';
    
    const newTop = Math.random() * (window.innerHeight - 50);
    const newLeft = Math.random() * (window.innerWidth - 150);
    
    kacanBtn.style.top = newTop + "px";
    kacanBtn.style.left = newLeft + "px";
  }
  
  // Tam Ekran Tuzağı
  function tamEkranDene() {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) { 
      document.documentElement.webkitRequestFullscreen();
    }
  }
</script>
</body>
</html>
