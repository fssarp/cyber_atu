<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siber Sözlük | Cyber ATU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0; font-family: monospace;
    background: black url('http://googleusercontent.com/image_collection/image_retrieval/13338421582616747988') no-repeat center center fixed;
    background-size: cover; color: #00ff00;
  }
  .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 0; }
  .container { position: relative; z-index: 1; margin-top: 50px; max-width: 1000px; padding-bottom: 50px; }
  
  .terminal-box {
    background: rgba(0, 0, 0, 0.9); border: 2px solid #00ff00;
    border-radius: 10px; padding: 30px; box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    backdrop-filter: blur(5px);
  }

  /* ARAMA KUTUSU */
  .search-container { margin-bottom: 30px; position: relative; }
  #searchTerm {
    width: 100%; background: rgba(0, 30, 0, 0.7); border: 2px solid #00ff00;
    color: #fff; padding: 15px 45px; font-size: 1.2rem; font-family: monospace;
    outline: none; box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
  }
  .search-icon { position: absolute; left: 15px; top: 18px; color: #00ff00; }

  /* SÖZLÜK LİSTESİ */
  .dict-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px; margin-top: 20px; max-height: 400px; overflow-y: auto; padding-right: 10px;
  }
  .dict-item {
    background: rgba(0, 50, 0, 0.2); border: 1px solid #004400;
    padding: 12px; cursor: pointer; transition: 0.3s; text-align: center;
  }
  .dict-item:hover { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; }

  /* DETAY ALANI */
  .detail-panel {
    margin-top: 30px; border-top: 1px dashed #00ff00; padding-top: 20px;
    display: none; animation: fadeIn 0.5s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .detail-title { font-size: 1.8rem; color: #fff; text-shadow: 0 0 10px #00ff00; margin-bottom: 10px; }
  .detail-content { font-size: 1.1rem; line-height: 1.6; color: #00ff00; }

  .back-link { display: block; margin-top: 25px; color: #00ff00; text-decoration: none; font-size: 1rem; }
  
  /* Scrollbar Güzelleştirme */
  .dict-list::-webkit-scrollbar { width: 5px; }
  .dict-list::-webkit-scrollbar-thumb { background: #00ff00; }
</style>
</head>
<body>
<div class="bg-overlay"></div>
<div class="container">
  <div class="terminal-box">
    <h3>>_ SİBER_SÖZLÜK v1.0</h3>
    <p style="color: #888; margin-bottom: 20px;">[SİSTEM] Aramak istediğiniz terimi yazın veya listeden seçin.</p>

    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchTerm" placeholder="Terim ara... (Örn: Brute Force)" onkeyup="filterDict()">
    </div>

    <div class="dict-list" id="dictList">
      </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-title" id="detTitle">Terim Adı</div>
      <div class="detail-content" id="detDesc">Açıklama burada görünecek.</div>
    </div>

    <a href="index.html" class="back-link"><< ana_dizine_don</a>
  </div>
</div>

<script>
  // Kapsamlı Siber Sözlük Verisi
  const dictionary = [
    { name: "Adware", desc: "Reklam destekli yazılım. Kullanıcının izni olmadan ekranda reklam gösteren kötü amaçlı yazılım türüdür." },
    { name: "Backdoor", desc: "Arka Kapı. Bir sisteme yetkisiz erişim sağlamak için normal güvenlik denetimlerini atlayan gizli giriş yolu." },
    { name: "Brute Force", desc: "Kaba Kuvvet Saldırısı. Deneme-yanılma yöntemiyle tüm olası kombinasyonları deneyerek şifre kırma eylemi." },
    { name: "Botnet", desc: "Zombi bilgisayar ağı. Hackerlar tarafından ele geçirilmiş ve uzaktan yönetilen cihazlar topluluğu." },
    { name: "Cryptography", desc: "Kriptografi. Bilgiyi gizlemek (şifrelemek) ve sadece yetkili kişilerce okunmasını sağlamak için kullanılan matematiksel teknikler." },
    { name: "DDoS", desc: "Dağıtılmış Hizmet Engelleme Saldırısı. Bir sistemi çok sayıda kaynaktan gelen trafikle boğarak erişilemez hale getirme." },
    { name: "Exploit", desc: "İstismar Yazılımı. Yazılımdaki bir zafiyeti veya hatayı kullanarak sisteme sızmak için tasarlanmış kod parçası." },
    { name: "Firewall", desc: "Güvenlik Duvarı. Gelen ve giden ağ trafiğini analiz edip belirli kurallara göre engelleyen koruma sistemi." },
    { name: "Hash", desc: "Karma Fonksiyonu. Veriyi benzersiz ve sabit uzunlukta bir diziye (parmak izine) dönüştüren tek yönlü matematiksel işlem." },
    { name: "Intrusion Detection", desc: "Saldırı Tespit Sistemi (IDS). Ağ trafiğini sürekli izleyerek şüpheli eylemleri tespit eden sistem." },
    { name: "Keylogger", desc: "Tuş Kaydedici. Kullanıcının klavyede bastığı her tuşu kaydedip saldırgana gönderen yazılım." },
    { name: "Malware", desc: "Kötü Amaçlı Yazılım. Virüs, worm, trojan gibi sisteme zarar vermeyi amaçlayan tüm programların genel adı." },
    { name: "Nmap", desc: "Network Mapper. Ağ taraması ve zafiyet tespiti için kullanılan açık kaynaklı efsanevi bir araçtır." },
    { name: "Phishing", desc: "Oltalama. Kullanıcıları sahte web siteleri veya e-postalarla kandırarak şifrelerini çalma yöntemi." },
    { name: "Payload", desc: "Faydalı Yük. Bir saldırıda asıl zararı veren, sisteme sızıldıktan sonra çalışan kod kısmıdır." },
    { name: "Ransomware", desc: "Fidye Yazılımı. Dosyaları şifreleyip açmak için kullanıcıdan para (kripto para) talep eden yazılım." },
    { name: "Social Engineering", desc: "Sosyal Mühendislik. İnsan psikolojisini kullanarak gizli bilgileri ele geçirme sanatı." },
    { name: "Trojan", desc: "Truva Atı. Yararlı gibi görünen ama aslında arka planda sisteme sızan zararlı yazılım." },
    { name: "VPN", desc: "Sanal Özel Ağ. İnternet trafiğini şifreleyerek anonimlik ve güvenli bağlantı sağlayan teknoloji." },
    { name: "Zero Day", desc: "Sıfırıncı Gün. Henüz yazılım üreticisi tarafından fark edilmemiş ve yaması yayınlanmamış güvenlik zafiyeti." },
    { name: "Worm", desc: "Solucan. Kendini kopyalayıp ağ üzerinden diğer sistemlere hızla yayılabilen zararlı yazılım." }
  ];

  const listContainer = document.getElementById('dictList');
  const detailPanel = document.getElementById('detailPanel');
  const detTitle = document.getElementById('detTitle');
  const detDesc = document.getElementById('detDesc');

  // Listeyi Başlat
  function displayItems(data) {
    listContainer.innerHTML = '';
    data.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
      const div = document.createElement('div');
      div.className = 'dict-item';
      div.innerText = item.name;
      div.onclick = () => showDetail(item);
      listContainer.appendChild(div);
    });
  }

  // Detay Göster (Siber Animasyonla)
  function showDetail(item) {
    detailPanel.style.display = 'block';
    detTitle.innerText = `>_ ${item.name.toUpperCase()}`;
    
    // Yazı yazma efekti
    let i = 0;
    detDesc.innerText = '';
    const interval = setInterval(() => {
      detDesc.innerText += item.desc.charAt(i);
      i++;
      if(i >= item.desc.length) clearInterval(interval);
    }, 15);

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // Arama Filtresi
  function filterDict() {
    const term = document.getElementById('searchTerm').value.toLowerCase();
    const filtered = dictionary.filter(x => x.name.toLowerCase().includes(term));
    displayItems(filtered);
    if(term === "") detailPanel.style.display = 'none';
  }

  displayItems(dictionary);
</script>
</body>
</html>
