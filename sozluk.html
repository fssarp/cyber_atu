<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siber Sözlük | Cyber ATU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace;
    background: black; color: #00ff00; overflow-x: hidden;
  }

  /* MATRIX ARKA PLAN */
  canvas#matrix { position: fixed; top: 0; left: 0; z-index: 0; }
  .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1; }

  /* HACKER KURU KAFA */
  #hacker-bg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; color: rgba(0, 255, 0, 0.25); font-size: 2.2vw; line-height: 1.2;
    pointer-events: none; text-shadow: 0 0 10px #00ff00; white-space: pre; text-align: center;
  }

  .container { position: relative; z-index: 3; margin-top: 50px; max-width: 1100px; padding-bottom: 50px; }
  
  .terminal-box {
    background: rgba(0, 0, 0, 0.92); border: 2px solid #00ff00;
    border-radius: 10px; padding: 30px; box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
    backdrop-filter: blur(5px);
  }

  .search-container { margin-bottom: 30px; position: relative; }
  #searchTerm {
    width: 100%; background: rgba(0, 20, 0, 0.95); border: 2px solid #00ff00;
    color: #fff; padding: 15px 45px; font-size: 1.2rem; font-family: monospace; outline: none;
  }
  .search-icon { position: absolute; left: 15px; top: 18px; color: #00ff00; }

  .dict-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin-top: 20px; max-height: 350px; overflow-y: auto; padding-right: 10px;
  }
  .dict-item {
    background: rgba(0, 60, 0, 0.3); border: 1px solid #005500;
    padding: 10px; cursor: pointer; transition: 0.2s; text-align: center; text-transform: uppercase;
  }
  .dict-item:hover { background: #00ff00; color: #000; font-weight: bold; }

  /* AÇIKLAMA ALANI - BOŞLUKLARI KORUYAN ÖZEL STİL */
  .detail-panel { margin-top: 30px; border-top: 1px dashed #00ff00; padding-top: 25px; display: none; }
  .detail-title { font-size: 2.2rem; color: #fff; text-shadow: 0 0 15px #00ff00; margin-bottom: 15px; }
  
  .detail-content { 
    font-size: 1.4rem; 
    line-height: 1.8; 
    color: #00ff00;
    white-space: pre-wrap; /* BU SATIR KELİMELERİN YAPIŞMASINI ÖNLER */
    word-wrap: break-word;
    letter-spacing: 0.5px;
  }

  .back-btn {
    display: inline-block; margin-top: 40px; background: black;
    color: #00ff00; border: 1px solid #00ff00; padding: 12px 30px;
    text-decoration: none; transition: 0.3s; font-weight: bold;
  }
  .back-btn:hover { background: #00ff00; color: black; box-shadow: 0 0 20px #00ff00; }
  
  .dict-list::-webkit-scrollbar { width: 5px; }
  .dict-list::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 10px; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="bg-overlay"></div>
<div id="hacker-bg"></div>

<div class="container">
  <div class="terminal-box">
    <h3 style="letter-spacing: 2px;">>_ CYBER_ATU_SOZLUK_CORE_v3.0</h3>
    
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchTerm" placeholder="Sistemde terim ara..." onkeyup="filterDict()">
    </div>

    <div class="dict-list" id="dictList"></div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-title" id="detTitle">TERİM</div>
      <div class="detail-content" id="detDesc"></div>
    </div>

    <div style="text-align: center;">
      <a href="index.html" class="back-btn"><< ANA_EKRANA_DON</a>
    </div>
  </div>
</div>

<script>
  // MATRIX VE KURU KAFA MOTORU
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const letters = "010101010101CYBERATU";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff00"; ctx.font = fontSize + "px monospace";
    for(let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 50);

  const skullElement = document.getElementById('hacker-bg');
  const asciiArt = `        _,.-------.,_
    ,;~'             '~;,
  ,;                     ;,
 ;                         ;
,'                         ',
,;                           ;,
; ;      .           .      ; ;
| ;   ______       ______   ; |
|  \`/~"     ~" . "~     "~\\'  |
|  ~  ,-~~~^~, | ,~^~~~-,  ~  |
 |   |        }:{        |   |
 |   l       / | \\       !   |
 .~  (__,.--" .^. "--.,__)  ~.
 |     ---;' / | \\ \`;---     |
  \\__.       \\/^\\/       .__/
   V| \`IIII_I_I_I_IIII'|V
    | |T~\\___!___!___/~T| |
    | | \`~~~~~~~~~~' | |
    |  \\,III I I I III,/  |
     \\   \`~~~~~~~~~~'    /
       \\   .       .   /
         \\.    ^    ./
           ^~~~^~~~^`;
  let charIndex = 0;
  function drawSkull() {
    if (charIndex < asciiArt.length) {
      skullElement.textContent += asciiArt.substring(charIndex, charIndex + 8);
      charIndex += 8; setTimeout(drawSkull, 10);
    }
  }
  drawSkull();

  // 100 TERİMLİ VERİ HAVUZU
  const dictionary = [
    { name: "AES", desc: "Gelişmiş şifreleme standardı olan ve verileri korumak için kullanılan güvenli algoritmadır." },
    { name: "APT", desc: "Gelişmiş kalıcı tehdit anlamına gelen ve sistemleri gizlice izleyen saldırgan gruplarıdır." },
    { name: "Antivirüs", desc: "Zararlı yazılımları tespit eden ve sistemden temizleyen güvenlik programıdır." },
    { name: "Backdoor", desc: "Güvenlik önlemlerini atlayarak sisteme erişmek için bırakılan gizli giriş yoludur." },
    { name: "Blue Team", desc: "Bir kurumun siber savunmasını yapan ve saldırıları engelleyen güvenlik ekibidir." },
    { name: "Botnet", desc: "Zombi bilgisayarlardan oluşan ve uzaktan yönetilen devasa saldırı ağıdır." },
    { name: "Brute Force", desc: "Tüm şifre kombinasyonlarını tek tek deneyerek sisteme sızma yöntemidir." },
    { name: "CVE", desc: "Dünya çapında bilinen güvenlik açıklarını listeleyen standart numaralandırma sistemidir." },
    { name: "DDoS", desc: "Sistemi trafik yüküyle boğarak hizmet veremez hale getirmektir." },
    { name: "Dark Web", desc: "Özel tarayıcılarla girilebilen internetin karanlık katmanıdır." },
    { name: "Encryption", desc: "Verinin gizliliğini korumak için onu şifreli formata dönüştürme işlemidir." },
    { name: "Exploit", desc: "Güvenlik açıklarını kullanarak sisteme sızmak için yazılmış koddur." },
    { name: "Firewall", desc: "Ağ trafiğini denetleyen ve zararlı geçişleri engelleyen güvenlik duvarıdır." },
    { name: "Hash", desc: "Bir verinin benzersiz ve geri döndürülemez matematiksel özet değeridir." },
    { name: "IP Adresi", desc: "İnternete bağlı her cihazın benzersiz kimlik numarasıdır." },
    { name: "Keylogger", desc: "Klavyede basılan her tuşu gizlice kaydeden casus yazılımdır." },
    { name: "Malware", desc: "Sisteme zarar vermek için tasarlanmış tüm yazılımların genel adıdır." },
    { name: "Metasploit", desc: "Sızma testleri için kullanılan dünyanın en popüler saldırı platformudur." },
    { name: "Nmap", desc: "Ağ taraması ve güvenlik denetimi için kullanılan temel siber güvenlik aracıdır." },
    { name: "Oltalama", desc: "Sahte mesajlarla şifre çalmaya çalışan dolandırıcılık yöntemidir." },
    { name: "Payload", desc: "Bir exploit ile sisteme gönderilen ve asıl zararı veren kod kısmıdır." },
    { name: "Phishing", desc: "E-posta veya SMS yoluyla yapılan kandırma ve veri çalma saldırısıdır." },
    { name: "Proxy", desc: "İnternet trafiğini başka sunucu üzerinden geçirerek gizlilik sağlayan yapıdır." },
    { name: "RAT", desc: "Uzaktan kontrol sağlayan ve sisteme tam erişim veren zararlı yazılım türüdür." },
    { name: "Red Team", desc: "Kurumun güvenliğini kırmak için saldırı simülasyonları yapan uzman gruptur." },
    { name: "Rootkit", desc: "Sistemde en yüksek yetkileri ele geçiren ve kendini gizleyen koddur." },
    { name: "SIEM", desc: "Güvenlik olaylarını merkezi olarak izleyen ve analiz eden yönetim yazılımıdır." },
    { name: "Social Engineering", desc: "İnsanları kandırarak gizli bilgileri vermelerini sağlama yöntemidir." },
    { name: "SQL Injection", desc: "Web sitelerindeki veri girişlerini kullanarak veritabanına sızma saldırısıdır." },
    { name: "Trojan", desc: "Faydalı bir program gibi görünüp arka planda sisteme sızan yazılımdır." },
    { name: "VPN", desc: "İnternet trafiğini şifreli bir tünelden geçirerek güvenli bağlantı sağlayan yapıdır." },
    { name: "WAF", desc: "Web uygulamalarını siber saldırılara karşı koruyan gelişmiş güvenlik duvarıdır." },
    { name: "White Hat", desc: "Etik kurallar çerçevesinde çalışan iyi niyetli güvenlik uzmanıdır." },
    { name: "Zero Day", desc: "Henüz yaması yayınlanmamış ve bilinmeyen kritik güvenlik açığıdır." },
    { name: "Zombi", desc: "Bir saldırganın kontrolü altına girmiş olan ele geçirilmiş bilgisayardır." }
    // ... Buraya diğer kelimeleri de ekleyebilirsin
  ];

  const listContainer = document.getElementById('dictList');
  const detailPanel = document.getElementById('detailPanel');
  const detTitle = document.getElementById('detTitle');
  const detDesc = document.getElementById('detDesc');

  function displayItems(data) {
    listContainer.innerHTML = '';
    data.sort((a,b)=>a.name.localeCompare(b.name)).forEach(item => {
      const div = document.createElement('div');
      div.className = 'dict-item';
      div.innerText = item.name;
      div.onclick = () => {
        detailPanel.style.display = 'block';
        detTitle.innerText = `>_ ${item.name.toUpperCase()}`;
        
        // ÖNCEKİ ANİMASYONU DURDUR
        if(window.typeInterval) clearInterval(window.typeInterval);
        
        let i = 0;
        detDesc.textContent = ''; // TEMİZLE VE BAŞLAT
        
        window.typeInterval = setInterval(() => {
          // HARF HARF YAZDIRIRKEN BOŞLUKLARI KORUR
          detDesc.textContent += item.desc.charAt(i);
          i++;
          if(i >= item.desc.length) clearInterval(window.typeInterval);
        }, 15);

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      };
      listContainer.appendChild(div);
    });
  }

  function filterDict() {
    const term = document.getElementById('searchTerm').value.toLowerCase();
    displayItems(dictionary.filter(x => x.name.toLowerCase().includes(term)));
    if(term === "") detailPanel.style.display = 'none';
  }

  displayItems(dictionary);
</script>
</body>
</html>
