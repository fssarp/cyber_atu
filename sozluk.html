<style>
  /* ... Diğer stiller aynı kalabilir ... */

  .detail-content { 
    font-size: 1.3rem; 
    line-height: 2; 
    color: #00ff00;
    text-align: left;
    word-spacing: 15px; /* KELİMELER ARASINDAKİ BOŞLUĞU BURADAN AYARLAYABİLİRSİN */
  }

  /* Eski spaced-text stilini siliyoruz veya kullanmıyoruz */
</style>

<script>
  // ... Dictionary verisi aynı kalıyor ...

  function showDetail(item) {
    detailPanel.style.display = 'block';
    detTitle.innerText = `>_ ${item.name.toUpperCase()}`;
    
    const description = item.desc;
    detDesc.innerHTML = ''; // Temizle
    
    // Kelimeleri tek tek dökme efekti (Yan yana cümle şeklinde)
    let i = 0;
    const interval = setInterval(() => {
      detDesc.innerText += description.charAt(i);
      i++;
      if(i >= description.length) {
        clearInterval(interval);
      }
    }, 15);

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // ... Geri kalan fonksiyonlar aynı ...
</script>
