<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarışmalar ve Oyun | Cyber ATU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0; font-family: monospace;
    background: black; color: #00ff00; overflow: hidden;
  }
  
  /* MATRIX ARKA PLAN */
  canvas#matrix { position: fixed; top: 0; left: 0; z-index: 0; }
  .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 1; }
  
  .container { position: relative; z-index: 2; text-align: center; margin-top: 100px; }
  .terminal-box {
    background-color: rgba(0, 0, 0, 0.85); border: 2px solid #00ff00;
    border-radius: 10px; padding: 40px; max-width: 700px; margin: 0 auto;
    text-align: left; box-shadow: 0 0 30px rgba(0, 255, 0, 0.4); backdrop-filter: blur(5px);
  }
  .menu-list a {
    color: #00ff00; text-decoration: none; display: block;
    margin-bottom: 20px; font-size: 1.3rem; transition: 0.3s;
  }
  .menu-list a:hover { text-shadow: 0 0 10px #00ff00; padding-left: 15px; font-weight: bold; }
  .terminal-input-row { display: flex; align-items: center; margin-top: 30px; border-top: 1px dashed #004400; padding-top: 20px; }
  #subInput { background: transparent; border: none; color: #fff; outline: none; flex-grow: 1; margin-left: 10px; font-family: monospace; font-size: 1.2rem; text-shadow: 0 0 5px #00ff00; }
  
  .back-btn {
    display: inline-block; margin-top: 30px; color: #00ff00; text-decoration: none; font-size: 1.1rem; border: 1px solid #00ff00; padding: 8px 20px; transition: 0.3s;
  }
  .back-btn:hover { background: #00ff00; color: black; box-shadow: 0 0 15px #00ff00; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="bg-overlay"></div>

<div class="container">
  <div class="terminal-box">
    <div style="border-bottom: 1px dashed #004400; margin-bottom: 25px; padding-bottom: 10px; font-size: 1.2rem; color: #fff;">
      >_ MODÜL: [06] YARIŞMALAR VE OYUNLAR
    </div>
    
    <div class="menu-list">
      <a href="typing_game.html">[01] Siber Klavye Testi (Hızlı Yazma)</a>
      <a href="kali_sim.html">[02] Kali Linux Zafiyet Simülatörü</a>
    </div>
    
    <div class="terminal-input-row">
      <span style="color: #00ff00;">cyber_atu@oyunlar:~$</span>
      <input type="text" id="subInput" autofocus autocomplete="off">
    </div>

    <div style="text-align: center;">
      <a href="index.html" class="back-btn"><< ANA_DİZİNE_DÖN</a>
    </div>
  </div>
</div>

<script>
  // MATRIX MOTORU
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const letters = "010101010101CYBERATU";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff00"; ctx.font = fontSize + "px monospace";
    for(let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 50);

  // KLAVYE YÖNLENDİRMESİ
  const input = document.getElementById('subInput');
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const val = input.value.trim();
      if(val === '1' || val === '01') window.location.href = 'typing_game.html';
      else if(val === '2' || val === '02') window.location.href = 'kali_sim.html';
      else alert("[!] HATA: Geçersiz Komut.");
      input.value = '';
    }
  });
  document.addEventListener('click', (e) => {
    if(e.target.tagName !== 'A') input.focus();
  });
</script>
</body>
</html>
