<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarışmalar ve Oyun | Cyber ATU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0; font-family: monospace;
    background: black url('http://googleusercontent.com/image_collection/image_retrieval/13338421582616747988') no-repeat center center fixed;
    background-size: cover; color: #00ff00; overflow: hidden;
  }
  .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 0; }
  .container { position: relative; z-index: 1; text-align: center; margin-top: 100px; }
  .terminal-box {
    background-color: rgba(0, 0, 0, 0.85); border: 2px solid #00ff00;
    border-radius: 10px; padding: 40px; max-width: 700px; margin: 0 auto;
    text-align: left; box-shadow: 0 0 30px rgba(0, 255, 0, 0.3); backdrop-filter: blur(5px);
  }
  .menu-list a {
    color: #00ff00; text-decoration: none; display: block;
    margin-bottom: 15px; font-size: 1.3rem; transition: 0.3s;
  }
  .menu-list a:hover { text-shadow: 0 0 10px #00ff00; padding-left: 10px; background: rgba(0, 255, 0, 0.1); }
  .terminal-input-row { display: flex; align-items: center; margin-top: 30px; border-top: 1px solid #002200; padding-top: 15px; }
  #subInput { background: transparent; border: none; color: #fff; outline: none; flex-grow: 1; margin-left: 10px; font-family: monospace; font-size: 1.2rem; }
</style>
</head>
<body>
<div class="bg-overlay"></div>
<div class="container">
  <div class="terminal-box">
    <div style="border-bottom: 1px dashed #004400; margin-bottom: 20px; padding-bottom: 10px;">
      >_ MODÜL: [06] YARIŞMALAR VE OYUNLAR
    </div>
    <div class="menu-list">
      <a href="typing_game.html">[01] Siber Klavye Testi (Hızlı Yazma)</a>
      <a href="sifreleyici.html">[02] Şifreleyici ve Çözücü</a>
      <a href="#">[03] Kali Linux Zafiyet Simülatörü</a>
    </div>
    <div class="terminal-input-row">
      <span style="color: #00ff00;">cyber_atu@root:~$</span>
      <input type="text" id="subInput" autofocus autocomplete="off">
    </div>
  </div>
</div>
<script>
  const input = document.getElementById('subInput');
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const val = input.value.trim();
      if(val === '1') window.location.href = 'typing_game.html';
      else if(val === '2') window.location.href = 'sifreleyici.html';
      else if(val === '3') alert("Simülatör hazırlanıyor...");
      input.value = '';
    }
  });
  document.addEventListener('click', () => input.focus());
</script>
</body>
</html>
