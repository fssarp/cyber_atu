<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siber Klavye Testi | Cyber ATU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: monospace;
    background: black;
    color: #00ff00;
    overflow-x: hidden;
  }
  .container {
    margin-top: 50px;
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .terminal-box {
    background-color: rgba(0, 0, 0, 0.9);
    border: 2px solid #00ff00;
    border-radius: 10px;
    padding: 30px;
    max-width: 800px;
    margin: 0 auto;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
  }
  .terminal-header {
    border-bottom: 1px dashed #004400;
    margin-bottom: 20px;
    padding-bottom: 10px;
    font-size: 1.2rem;
    text-align: left;
  }
  .stats-board {
    display: flex;
    justify-content: space-between;
    font-size: 1.5rem;
    margin-bottom: 20px;
    border: 1px solid #00ff00;
    padding: 15px;
    border-radius: 5px;
    background: #001100;
  }
  .word-display {
    font-size: 2rem;
    letter-spacing: 2px;
    margin: 30px 0;
    min-height: 60px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }
  .word {
    color: #444; 
  }
  .word.active {
    color: #00ff00; 
    text-shadow: 0 0 10px #00ff00;
    text-decoration: underline;
  }
  .word.error {
    color: red;
    text-shadow: 0 0 10px red;
  }
  input[type="text"] {
    background: black;
    border: 2px solid #00ff00;
    color: #00ff00;
    font-family: monospace;
    font-size: 1.5rem;
    padding: 15px;
    width: 60%;
    text-align: center;
    border-radius: 5px;
    outline: none;
    box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
  }
  input[type="text"]:disabled {
    border-color: #444;
    color: #444;
  }
  .btn-cyber {
    background: black;
    color: #00ff00;
    border: 2px solid #00ff00;
    padding: 10px 30px;
    font-family: monospace;
    font-size: 1.2rem;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 20px;
    transition: 0.3s;
  }
  .btn-cyber:hover {
    background: #00ff00;
    color: black;
    box-shadow: 0 0 15px #00ff00;
  }
  #results {
    display: none;
    margin-top: 20px;
    font-size: 1.5rem;
    color: #00ff00;
    border-top: 1px dashed #004400;
    padding-top: 20px;
  }
  .retry-link {
    display: none;
    margin-top: 30px;
    color: #00ff00;
    background: transparent;
    border: none;
    font-family: monospace;
    font-size: 1.2rem;
    cursor: pointer;
    outline: none;
    text-decoration: none;
  }
  .retry-link:hover {
    text-shadow: 0 0 10px #00ff00;
  }
  .back-link {
    display: inline-block;
    margin-top: 30px;
    color: #00ff00;
    text-decoration: none;
    font-size: 1.1rem;
  }
  .back-link:hover {
    text-shadow: 0 0 8px #00ff00;
  }
</style>
</head>
<body>

<div class="container">
  <div class="terminal-box">
    <div class="terminal-header">
      >_ MODÜL: [01] SİBER KLAVYE TESTİ<br>
      <span style="font-size:0.9rem; color:#aaa;">Görev: Ekrana gelen siber güvenlik terimlerini en hızlı şekilde yaz. Kelimeyi bitirince BOŞLUK (Space) tuşuna bas.</span>
    </div>

    <div class="stats-board">
      <div>SÜRE: <span id="time">60</span>s</div>
      <div>SKOR: <span id="score">0</span></div>
    </div>

    <div class="word-display" id="wordDisplay">
      </div>

    <input type="text" id="typeInput" placeholder="Başlamak için butona tıkla..." disabled autocomplete="off">
    <br>
    <button class="btn-cyber" id="startBtn">SİSTEMİ BAŞLAT</button>

    <div id="results">
      <h3>>_ ANALİZ RAPORU</h3>
      <p>Yazma Hızı (WPM): <span id="wpmResult">0</span></p>
      <p>Doğruluk Oranı: %<span id="accuracyResult">0</span></p>
    </div>

    <button id="retryBtn" class="retry-link">>> yeniden_dene</button>
    <br>
    <a href="rank.html" class="back-link"><< menuye_don</a>
  </div>
</div>

<script>
  const wordsArray = [
    'siber', 'güvenlik', 'terminal', 'şifre', 'protokol', 'sunucu', 'yazılım', 
    'matris', 'kriptografi', 'zafiyet', 'kimlik', 'saldırı', 'savunma', 'kötücül', 
    'yedekleme', 'şifreleme', 'veritabanı', 'sistem', 'ağ', 'korsan', 'firewall', 
    'phishing', 'malware', 'botnet', 'sızıntı', 'istismar', 'açık', 'şifreçözücü',
    'linux', 'kali', 'sertifika', 'payload', 'trojan', 'ransomware', 'hash'
  ];

  let time = 60;
  let score = 0;
  let mistakes = 0;
  let isPlaying = false;
  let timerInterval;
  let currentWords = [];
  let currentWordIndex = 0;

  const timeDisplay = document.getElementById('time');
  const scoreDisplay = document.getElementById('score');
  const wordDisplay = document.getElementById('wordDisplay');
  const typeInput = document.getElementById('typeInput');
  const startBtn = document.getElementById('startBtn');
  const resultsDiv = document.getElementById('results');
  const wpmResult = document.getElementById('wpmResult');
  const accuracyResult = document.getElementById('accuracyResult');
  const retryBtn = document.getElementById('retryBtn');

  function shuffleWords() {
    return wordsArray.sort(() => Math.random() - 0.5);
  }

  function loadWords() {
    currentWords = shuffleWords().slice(0, 10);
    wordDisplay.innerHTML = '';
    currentWords.forEach((word, index) => {
      const span = document.createElement('span');
      span.innerText = word;
      span.classList.add('word');
      if (index === 0) span.classList.add('active');
      wordDisplay.appendChild(span);
    });
    currentWordIndex = 0;
  }

  function startGame() {
    if (isPlaying) return;
    isPlaying = true;
    time = 60;
    score = 0;
    mistakes = 0;
    scoreDisplay.innerText = score;
    timeDisplay.innerText = time;
    
    resultsDiv.style.display = 'none';
    startBtn.style.display = 'none';
    retryBtn.style.display = 'none';
    
    typeInput.disabled = false;
    typeInput.placeholder = "Yazmaya başla...";
    typeInput.value = '';
    typeInput.focus();

    loadWords();
    timerInterval = setInterval(updateTime, 1000);
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  function updateTime() {
    time--;
    timeDisplay.innerText = time;
    if (time === 0) {
      endGame();
    }
  }

  function endGame() {
    clearInterval(timerInterval);
    isPlaying = false;
    typeInput.disabled = true;
    typeInput.value = '';
    typeInput.placeholder = "Sistem kilitlendi.";
    
    const totalAttempts = score + mistakes;
    const accuracy = totalAttempts > 0 ? Math.round((score / totalAttempts) * 100) : 0;
    
    wpmResult.innerText = score;
    accuracyResult.innerText = accuracy;
    
    resultsDiv.style.display = 'block';
    retryBtn.style.display = 'inline-block';
  }

  typeInput.addEventListener('input', (e) => {
    const activeWordSpan = wordDisplay.childNodes[currentWordIndex];
    const typedText = typeInput.value;
    const targetWord = currentWords[currentWordIndex];

    if (typedText.endsWith(' ')) {
      const cleanTyped = typedText.trim();
      
      if (cleanTyped === targetWord) {
        score++;
        scoreDisplay.innerText = score;
        activeWordSpan.style.color = '#004400'; 
      } else {
        mistakes++;
        activeWordSpan.style.color = 'red'; 
      }
      
      activeWordSpan.classList.remove('active');
      activeWordSpan.classList.remove('error');
      
      typeInput.value = '';
      currentWordIndex++;

      if (currentWordIndex >= currentWords.length) {
        loadWords();
      } else {
        wordDisplay.childNodes[currentWordIndex].classList.add('active');
      }
      return;
    }

    if (!targetWord.startsWith(typedText)) {
      activeWordSpan.classList.add('error');
    } else {
      activeWordSpan.classList.remove('error');
    }
  });
</script>

</body>
</html>
