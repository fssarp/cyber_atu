<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etkinliklerimiz | Cyber ATU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: monospace;
    background: black;
    color: #00ff00;
    overflow-x: hidden;
  }
  canvas#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    opacity: 0.3;
  }
  section {
    padding: 100px 20px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  
  /* --- ÜST MENÜ --- */
  .header-alani {
    position: absolute; 
    top: 20px;
    right: 30px;
    z-index: 999; 
  }
  .dropdown { position: relative; display: inline-block; }
  .dropbtn {
    background-color: black; color: #00ff00; padding: 10px 20px; font-size: 16px;
    font-family: monospace; border: 1px solid #00ff00; cursor: pointer;
    border-radius: 5px; transition: 0.3s;
  }
  .dropbtn:hover { background-color: #00ff00; color: black; box-shadow: 0 0 10px #00ff00; }
  .dropdown-content {
    display: none; position: absolute; right: 0; background-color: black;
    min-width: 160px; border: 1px solid #00ff00; z-index: 1; border-radius: 5px;
  }
  .dropdown-content a {
    color: #00ff00; padding: 12px 16px; text-decoration: none; display: block;
    font-family: monospace; transition: 0.2s;
  }
  .dropdown-content a:hover { background-color: #00ff00; color: black; }
  .dropdown:hover .dropdown-content { display: block; }

  /* --- LOGO --- */
  .site-logo {
    position: absolute; top: 20px; left: 30px; width: 100px; height: auto;
    z-index: 1000; transition: 0.3s; cursor: pointer;
  }
  .site-logo:hover { filter: drop-shadow(0 0 15px #00ff00); transform: scale(1.05); }

  /* --- ETKİNLİK GALERİSİ --- */
  .gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
    padding: 20px;
  }

  .event-card {
    background: rgba(0, 20, 0, 0.8);
    border: 1px solid #00ff00;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
    transition: 0.4s;
    overflow: hidden;
  }

  .event-card:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
    border-color: #fff;
  }

  .event-card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid #00ff00;
    transition: 0.4s;
    filter: brightness(0.8);
  }

  .event-card:hover img {
    filter: brightness(1.1);
    border-color: #fff;
  }

  .btn-geri {
    display: inline-block;
    margin-top: 50px;
    padding: 12px 25px;
    background: transparent;
    color: #00ff00;
    border: 1px solid #00ff00;
    text-decoration: none;
    transition: 0.3s;
    border-radius: 5px;
    font-weight: bold;
  }
  .btn-geri:hover {
    background: #00ff00; color: black; box-shadow: 0 0 15px #00ff00;
  }
  
  .page-title {
    text-align: center;
    font-size: 2.8rem;
    text-shadow: 0 0 15px #00ff00;
    margin-bottom: 50px;
    border-bottom: 2px dashed #00ff00;
    padding-bottom: 20px;
    display: inline-block;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<a href="index.html">
  <img src="cyber_atu_logo.jpg" alt="Cyber ATU Logo" class="site-logo">
</a>

<div class="header-alani">
  <div class="dropdown">
    <button class="dropbtn">Bizi Tanıyın ▼</button>
    <div class="dropdown-content">
      <a href="biz_kimiz.html">> Biz Kimiz?</a>
      <a href="#">> Vizyonumuz</a>
      <a href="ekibimiz.html">> Etkinliklerimiz</a>
    </div>
  </div>
</div>

<section>
  <div class="container" style="position: relative; z-index: 1; text-align: center;">
    
    <h1 class="page-title">>_ ETKİNLİKLERİMİZDEN GÖRÜNTÜLER</h1>
    
    <div class="gallery-container">
      
      <div class="event-card"><img src="1.jpeg" alt="Etkinlik 1"></div>
      <div class="event-card"><img src="2.jpeg" alt="Etkinlik 2"></div>
      <div class="event-card"><img src="3.jpeg" alt="Etkinlik 3"></div>
      <div class="event-card"><img src="4.jpeg" alt="Etkinlik 4"></div>
      <div class="event-card"><img src="5.jpeg" alt="Etkinlik 5"></div>
      <div class="event-card"><img src="6.jpeg" alt="Etkinlik 6"></div>
      <div class="event-card"><img src="7.jpeg" alt="Etkinlik 7"></div>
      <div class="event-card"><img src="8.jpeg" alt="Etkinlik 8"></div>
      <div class="event-card"><img src="9.jpeg" alt="Etkinlik 9"></div>

    </div>

    <a href="index.html" class="btn-geri">< Ana Terminale Dön</a>

  </div>
</section>

<script>
  // MATRIX EFEKTİ
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const letters = "0101010101";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";
    for(let i=0;i<drops.length;i++){
      const text = letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(text,i*fontSize,drops[i]*fontSize);
      if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw,50);
  window.addEventListener('resize',()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
