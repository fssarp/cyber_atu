<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRİTİK UYARI | Cyber ATU</title>
<style>
  body {
    margin: 0; padding: 0; font-family: monospace;
    background: black; overflow: hidden;
  }
  
  /* MATRIX ARKA PLAN */
  canvas#matrix { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.5; }
  
  /* HACKLENDİNİZ MESAJ KUTUSU (MODAL) */
  .alert-box {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 0, 0, 0.95); border: 3px solid #ff0000;
    box-shadow: 0 0 50px rgba(255, 0, 0, 0.8); border-radius: 10px;
    padding: 40px; text-align: center; z-index: 10; width: 85%; max-width: 500px;
    animation: popIn 0.5s ease-out forwards;
  }

  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    80% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  .alert-box h1 {
    color: #ff0000; font-size: 3rem; margin-top: 0;
    text-shadow: 0 0 15px #ff0000; animation: blink 1s infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .alert-box p { color: #fff; font-size: 1.3rem; line-height: 1.6; }
  
  .highlight {
    color: #00ff00; font-size: 1.5rem; font-weight: bold;
    display: block; margin: 20px 0; text-shadow: 0 0 10px #00ff00;
  }

  .timer-text { color: #aaa; font-size: 1rem; margin-top: 20px; }

  .btn {
    background: #ff0000; color: #fff; border: 1px solid #ff0000;
    padding: 10px 20px; font-size: 1.1rem; cursor: pointer;
    font-family: monospace; font-weight: bold; transition: 0.3s; margin-top: 15px;
  }
  .btn:hover { background: transparent; color: #ff0000; box-shadow: 0 0 15px #ff0000; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="alert-box">
  <h1>>_ HACKLENDİNİZ!</h1>
  <p>Cihazınızdaki güvenlik protokolleri aşıldı...</p>
  
  <span class="highlight">"Her gördüğünüz QR kodu okutmayınız :)"</span>
  
  <p style="font-size: 1.1rem;">Siber güvenlikte en zayıf halka her zaman insandır.</p>
  
  <div class="timer-text">Güvenli alana yönlendiriliyorsunuz... (<span id="countdown">3.5</span>)</div>
  <button class="btn" onclick="yonlendir()">Hemen Geç</button>
</div>

<script>
  // MATRIX EFEKTİ
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const letters = "010101010101HACKED";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff0000"; 
    ctx.font = fontSize + "px monospace";
    for(let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 50);

  // 3.5 SANİYELİK HIZLI GERİ SAYIM MOTORU
  let seconds = 3.5;
  const timerElement = document.getElementById('countdown');
  
  function yonlendir() {
    window.location.href = 'bilinc.html';
  }

  // Her 0.5 saniyede bir sayacı günceller
  const countdownInterval = setInterval(() => {
    seconds -= 0.5;
    
    // Ekrana 3.0, 2.5 gibi ondalıklı formatta yazdırır
    timerElement.innerText = seconds.toFixed(1); 
    
    if (seconds <= 0) {
      clearInterval(countdownInterval);
      yonlendir();
    }
  }, 500); // 500 milisaniye = 0.5 saniye
</script>
</body>
</html>
